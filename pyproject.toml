[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iscan"
version = "0.1.0"
description = "Local duplicate photo finder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx",
    "numpy",
    "Pillow",
    "pillow-heif",
    "rawpy",
    "ExifRead",
    "rich",
    "typer",
]

[project.scripts]
iscan = "iscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]