[project]
name = "iscan"
version = "0.1.0"
description = "Local-first CLI for finding duplicate and near-duplicate photos."
readme = "README.md"
authors = [
    { name = "Ruslan Suleymenov" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mlx>=0.31.2",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
    "rawpy>=0.27.0",
    "rich>=15.0.0",
    "typer>=0.26.4",
]

[project.scripts]
iscan = "iscan.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
